# ULOO Standalone Multi-Agent Platform (Pure Clean Mode)
# 一键拉起纯净独立模式：PostgreSQL (pgvector) + Redis + ULOO Core (含内置极速 UI)

services:
  uloo-db:
    image: pgvector/pgvector:pg16
    container_name: uloo-postgres
    restart: always
    environment:
      POSTGRES_DB: ${ULOO_DB_NAME:-uloo}
      POSTGRES_USER: ${ULOO_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ULOO_DB_PASSWORD:-difyai123456}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - uloo-pgdata:/var/lib/postgresql/data
    ports:
      - "${ULOO_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ULOO_DB_USER:-postgres} -d ${ULOO_DB_NAME:-uloo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  uloo-redis:
    image: redis:7-alpine
    container_name: uloo-redis
    restart: always
    ports:
      - "${ULOO_REDIS_PORT:-6379}:6379"
    volumes:
      - uloo-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  uloo-core:
    build:
      context: ./services/uloo-core
      dockerfile: Dockerfile
    container_name: uloo-core
    restart: always
    depends_on:
      uloo-db:
        condition: service_healthy
      uloo-redis:
        condition: service_healthy
    ports:
      - "8200:8200"
    environment:
      - PORT=8200
      - ULOO_DB_HOST=uloo-db
      - ULOO_DB_PORT=5432
      - ULOO_DB_USERNAME=${ULOO_DB_USER:-postgres}
      - ULOO_DB_PASSWORD=${ULOO_DB_PASSWORD:-difyai123456}
      - ULOO_DB_DATABASE=${ULOO_DB_NAME:-uloo}
      - ULOO_REDIS_HOST=uloo-redis
      - ULOO_REDIS_PORT=6379
      - ULOO_API_TOKEN=${ULOO_API_TOKEN:-uloo-dev-service-token-2026-local}
      - ULOO_DIFY_API_URL=${ULOO_DIFY_API_URL:-http://localhost:5001}
      - ULOO_LLM_BASE_URL=${ULOO_LLM_BASE_URL:-${DEEPSEEK_API_BASE:-http://172.26.197.154:3000/v1}}
      - ULOO_LLM_API_KEY=${ULOO_LLM_API_KEY:-${DEEPSEEK_API_KEY:-}}
      - ULOO_LLM_MODEL=${ULOO_LLM_MODEL:-${MODEL_DEFAULT:-deepseek-chat}}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8200/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  uloo-pgdata:
  uloo-redisdata:
