[project]
name = "uloo-core"
version = "0.1.0"
description = "ULOO Core API - Agent, Team, Run, Event, Memory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "structlog>=24.4.0,<25.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # Agno is the only Team scheduler, and ULOO's accepted Team modes are pinned
    # to the runtime's Literal (see src/uloo/constants.py). Keep this range tight
    # so a silent minor upgrade cannot change mode semantics underneath us.
    "agno>=1.8.4,<1.9.0",
    "jsonschema>=4.23,<5",
    "openai>=1.109.1,<2",
    "ddgs>=9,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "types-jsonschema>=4.26.0.20261006",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uloo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
