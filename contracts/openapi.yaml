          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Configuration Snapshot
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          title: Id
          type: string
        input_text:
          title: Input Text
          type: string
        is_mock:
          title: Is Mock
          type: boolean
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        plan_id:
          title: Plan Id
          type: string
        runtime_type:
          title: Runtime Type
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          title: Status
          type: string
        task_id:
          title: Task Id
          type: string
        team_id:
          title: Team Id
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        usage:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
