components:
  schemas:
    AgentCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          default: true
          title: Enabled
          type: boolean
        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          title: Key
          type: string
        knowledge_refs:
          items:
            type: string
          title: Knowledge Refs
          type: array
        model_ref:
          description: e.g. openai-compatible:gpt-5-mini
          maxLength: 256
          minLength: 1
          title: Model Ref
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          maxLength: 256
          minLength: 1
          title: Role
          type: string
        skill_refs:
          items:
            type: string
          title: Skill Refs
          type: array
        tool_refs:
          items:
            type: string
          title: Tool Refs
          type: array
        workflow_refs:
          description: Dify workflow app IDs
          items:
            type: string
          title: Workflow Refs
          type: array
      required:
      - key
      - name
      - role
      - model_ref
      title: AgentCreate
      type: object
    AgentResponse:
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          title: Enabled
          type: boolean
        id:
          title: Id
          type: string
        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          title: Key
          type: string
        knowledge_refs:
          items:
            type: string
          title: Knowledge Refs
          type: array
        model_ref:
          description: e.g. openai-compatible:gpt-5-mini
          maxLength: 256
          minLength: 1
          title: Model Ref
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          maxLength: 256
          minLength: 1
          title: Role
          type: string
        skill_refs:
          items:
            type: string
          title: Skill Refs
          type: array
        tool_refs:
          items:
            type: string
          title: Tool Refs
          type: array
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        version:
          title: Version
          type: integer
        workflow_refs:
          description: Dify workflow app IDs
          items:
            type: string
          title: Workflow Refs
          type: array
      required:
      - key
      - name
      - role
      - model_ref
      - id
      - enabled
      - version
      title: AgentResponse
      type: object
    AgentTestRunRequest:
      properties:
        prompt:
          default: Confirm that this Agent is ready and summarize its role.
          maxLength: 20000
          minLength: 1
          title: Prompt
          type: string
      title: AgentTestRunRequest
      type: object
    AgentTestRunResponse:
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        is_mock:
          default: false
          title: Is Mock
          type: boolean
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        runtime_type:
          default: agno
          title: Runtime Type
          type: string
        status:
          title: Status
          type: string
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        usage:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Usage
      required:
      - status
      title: AgentTestRunResponse
      type: object
    AgentUpdate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        expected_version:
          description: Optimistic lock version
          minimum: 1.0
          title: Expected Version
          type: integer
        instructions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Instructions
        knowledge_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Knowledge Refs
        model_ref:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Model Ref
        name:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Role
        skill_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Skill Refs
        tool_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tool Refs
        workflow_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Workflow Refs
      required:
      - expected_version
      title: AgentUpdate
      type: object
    AgentValidateResponse:
      properties:
        errors:
          items:
            type: string
          title: Errors
          type: array
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: AgentValidateResponse
      type: object
    Body_upload_file_api_v1_files_upload_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_upload_file_api_v1_files_upload_post
      type: object
    CapabilitiesResponse:
      description: Capabilities currently available from this running Core version.
      properties:
        agno_enabled:
          title: Agno Enabled
          type: boolean
        features:
          $ref: '#/components/schemas/FeatureCapabilities'
        models:
          additionalProperties:
            $ref: '#/components/schemas/ModelProviderInfo'
          title: Models
          type: object
        modes:
          items:
            type: string
          title: Modes
          type: array
        provider_aliases:
          additionalProperties:
            type: string
          title: Provider Aliases
          type: object
        tools:
          items:
            type: string
          title: Tools
          type: array
        version:
          title: Version
          type: string
      required:
      - version
      - modes
      - features
      - models
      - tools
      - agno_enabled
      title: CapabilitiesResponse
      type: object
    CompletionConditions:
      properties:
        all_members_executed:
          default: true
          description: Every member must have executed at least once
          title: All Members Executed
          type: boolean
        custom:
          default: ''
          description: Additional custom completion criteria
          maxLength: 2000
          title: Custom
          type: string
        no_unresolved_errors:
          default: true
          description: No unresolved errors at finish
          title: No Unresolved Errors
          type: boolean
      title: CompletionConditions
      type: object
    ErrorResponse:
      description: Stable error envelope returned by every ULOO Core endpoint.
      properties:
        code:
          description: Stable machine-readable error code
          title: Code
          type: string
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
        message:
          description: Safe human-readable error message
          title: Message
          type: string
        request_id:
          title: Request Id
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - code
      - message
      - request_id
      - trace_id
      title: ErrorResponse
      type: object
    FeatureCapabilities:
      description: Feature flags describe implemented behavior, not planned behavior.
      properties:
        agent_test_runs:
          title: Agent Test Runs
          type: boolean
        agents:
          title: Agents
          type: boolean
        memory:
          title: Memory
          type: boolean
        streaming:
          title: Streaming
          type: boolean
        team_runs:
          title: Team Runs
          type: boolean
        teams:
          title: Teams
          type: boolean
      required:
      - agents
      - teams
      - agent_test_runs
      - team_runs
      - streaming
      - memory
      title: FeatureCapabilities
      type: object
    FileUploadResponse:
      description: Metadata response for an uploaded file.
      properties:
        content_type:
          default: application/octet-stream
          description: MIME content type
          title: Content Type
          type: string
        created_at:
          description: ISO-8601 creation timestamp
          title: Created At
          type: string
        file_name:
          description: Original filename uploaded by the user
          title: File Name
          type: string
        file_path:
          description: Relative storage path used by tools and runtime
          title: File Path
          type: string
        file_size:
          description: File size in bytes
          title: File Size
          type: integer
        status:
          default: ok
          title: Status
          type: string
      required:
      - file_name
      - file_path
      - file_size
      - created_at
      title: FileUploadResponse
      type: object
    McpDiscoverRequest:
      additionalProperties: false
      description: Request to discover tools from an MCP Server.
      properties:
        args:
          items:
            type: string
          maxItems: 50
          title: Args
          type: array
        command:
          default: ''
          maxLength: 512
          title: Command
          type: string
        enabled_tools:
          items:
            type: string
          maxItems: 100
          title: Enabled Tools
          type: array
        endpoint_url:
          default: ''
          maxLength: 2048
          title: Endpoint Url
          type: string
        env:
          additionalProperties:
            type: string
          maxProperties: 50
          title: Env
          type: object
        headers:
          additionalProperties:
            type: string
          maxProperties: 20
          title: Headers
          type: object
        transport:
          enum:
          - sse
          - stdio
          title: Transport
          type: string
      required:
      - transport
      title: McpDiscoverRequest
      type: object
    McpDiscoverResponse:
      additionalProperties: false
      description: Response containing all tools discovered from an MCP Server.
      properties:
        tools:
          items:
            $ref: '#/components/schemas/McpToolInfo'
          title: Tools
          type: array
      required:
      - tools
      title: McpDiscoverResponse
      type: object
    McpToolInfo:
      additionalProperties: false
      description: Single tool discovered from an MCP Server.
      properties:
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        input_schema:
          additionalProperties: true
          title: Input Schema
          type: object
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: McpToolInfo
      type: object
    MemoryCreate:
      description: Payload to record a new long-term memory.
      properties:
        category:
          default: fact
          description: 'Memory type: fact, preference, or guideline'
          enum:
          - fact
          - preference
          - guideline
          title: Category
          type: string
        content:
          description: Durable memory content
          maxLength: 10000
          minLength: 1
          title: Content
          type: string
        keywords:
          description: Keywords for fast semantic recall
          items:
            type: string
          title: Keywords
          type: array
        source_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Optional Task Run ID that consolidated this memory
          title: Source Run Id
      required:
      - content
      title: MemoryCreate
      type: object
    MemoryListResponse:
      description: Paginated list of memories.
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemoryResponse'
          title: Items
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - offset
      - limit
      title: MemoryListResponse
      type: object
    MemoryPolicy:
      properties:
        read_scopes:
          items:
            enum:
            - project
            - team
            - agent
            type: string
          title: Read Scopes
          type: array
        write_scope:
          default: team
          enum:
          - project
          - team
          - agent
          title: Write Scope
          type: string
      title: MemoryPolicy
      type: object
    MemoryRecallResponse:
      description: Top matched memories recalled for a specific query.
      properties:
        formatted_context:
          title: Formatted Context
          type: string
        query:
          title: Query
          type: string
        recalled:
          items:
            $ref: '#/components/schemas/MemoryResponse'
          title: Recalled
          type: array
      required:
      - query
      - recalled
      - formatted_context
      title: MemoryRecallResponse
      type: object
    MemoryResponse:
      description: Full detail of a memory item.
      properties:
        category:
          title: Category
          type: string
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        has_embedding:
          default: false
          title: Has Embedding
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        keywords:
          items:
            type: string
          title: Keywords
          type: array
        source_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Source Run Id
        updated_at:
          format: date-time
          title: Updated At
          type: string
        workspace_id:
          format: uuid
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - category
      - content
      - keywords
      - created_at
      - updated_at
      title: MemoryResponse
      type: object
    ModelConfigSync:
      description: Batch of model provider configurations to sync.
      properties:
        aliases:
          additionalProperties:
            type: string
          description: Dify→ULOO provider aliases
          title: Aliases
          type: object
        providers:
          items:
            $ref: '#/components/schemas/ModelProviderConfig'
          title: Providers
          type: array
      required:
      - providers
      title: ModelConfigSync
      type: object
    ModelConfigSyncResponse:
      description: Result of a model config sync.
      properties:
        synced_providers:
          items:
            type: string
          title: Synced Providers
          type: array
        total_models:
          title: Total Models
          type: integer
      required:
      - synced_providers
      - total_models
      title: ModelConfigSyncResponse
      type: object
    ModelProviderConfig:
      description: One model provider configuration pushed from the Dify workspace.
      properties:
        api_key:
          description: API key for this provider
          format: password
          title: Api Key
          type: string
          writeOnly: true
        base_url:
          default: ''
          description: API base URL, empty for default
          title: Base Url
          type: string
        model_ids:
          description: Available model IDs
          items:
            type: string
          title: Model Ids
          type: array
        provider:
          description: Provider key (e.g. 'deepseek' or Dify ID)
          title: Provider
          type: string
      required:
      - provider
      - api_key
      title: ModelProviderConfig
      type: object
    ModelProviderInfo:
      description: 'Selectability info for one configured model provider.


        `models` is the list of model ids the UI may offer for this provider.

        Credentials are never included; the UI only needs names to build a picker.'
      properties:
        base_url:
          title: Base Url
          type: string
        models:
          items:
            type: string
          title: Models
          type: array
      required:
      - base_url
      title: ModelProviderInfo
      type: object
    Page_AgentResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentResponse'
          title: Items
          type: array
        limit:
          minimum: 1.0
          title: Limit
          type: integer
        offset:
          minimum: 0.0
          title: Offset
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      - offset
      - limit
      title: Page[AgentResponse]
      type: object
    Page_TeamResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TeamResponse'
          title: Items
          type: array
        limit:
          minimum: 1.0
          title: Limit
          type: integer
        offset:
          minimum: 0.0
          title: Offset
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      - offset
      - limit
      title: Page[TeamResponse]
      type: object
    PreCheckIssue:
      description: A single dependency check result.
      properties:
        category:
          enum:
          - team
          - model
          - tool
          - knowledge
          title: Category
          type: string
        detail:
          maxLength: 500
          title: Detail
          type: string
        fix_link:
          anyOf:
          - type: string
          - type: 'null'
          description: Route to fix the issue
          title: Fix Link
        status:
          enum:
          - ok
          - missing
          - misconfigured
          title: Status
          type: string
      required:
      - category
      - status
      - detail
      title: PreCheckIssue
      type: object
    ResourceCreate:
      additionalProperties: false
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        enabled:
          default: true
          title: Enabled
          type: boolean
        key:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9._-]*$
          title: Key
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
      required:
      - key
      - name
      title: ResourceCreate
      type: object
    ResourceResponse:
      additionalProperties: false
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        enabled:
          default: true
          title: Enabled
          type: boolean
        key:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9._-]*$
          title: Key
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        version:
          title: Version
          type: integer
      required:
      - key
      - name
      - version
      title: ResourceResponse
      type: object
    ResourceUpdate:
      additionalProperties: false
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        enabled:
          title: Enabled
          type: boolean
        expected_version:
          minimum: 0.0
          title: Expected Version
          type: integer
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - config
      - enabled
      - expected_version
      title: ResourceUpdate
      type: object
    ReviewPolicy:
      properties:
        criteria:
          description: Review criteria checklist
          items:
            type: string
          maxItems: 20
          title: Criteria
          type: array
        max_rounds:
          default: 3
          description: Maximum review/rework cycles before escalation
          maximum: 10.0
          minimum: 1.0
          title: Max Rounds
          type: integer
        require_human_input:
          default: false
          description: If true, pause for human supplement after the first failed review round
          title: Require Human Input
          type: boolean
        require_unanimous:
          default: false
          description: If true, all reviewers must approve
          title: Require Unanimous
          type: boolean
      title: ReviewPolicy
      type: object
    RunContinueRequest:
      description: 'P0/S3-5: User supplement submitted to resume a paused run.


        When a run is in ``awaiting_input`` status (the first review round

        failed and the team''s review_policy has ``require_human_input=True``),

        the caller must provide a ``supplement`` clarifying the ambiguous

        conditions.  The background executor incorporates this supplement into

        the next rework round''s prompt and continues from the pause point.'
      properties:
        supplement:
          maxLength: 100000
          minLength: 1
          title: Supplement
          type: string
      required:
      - supplement
      title: RunContinueRequest
      type: object
    RunCreate:
      properties:
        confirm_write_replay:
          default: false
          description: 'Idempotency gate for retry: must be true when the retried run''s team binds any write-effect tool
            (dify, mcp_sse, mcp_stdio) or any agent with non-empty workflow_refs. Prevents accidental replay of write/submit
            side effects on a fresh run.'
          title: Confirm Write Replay
          type: boolean
        expected_plan_version:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Expected Plan Version
        input:
          anyOf:
          - maxLength: 100000
            minLength: 1
            type: string
          - type: 'null'
          title: Input
      title: RunCreate
      type: object
    RunDetailResponse:
      properties:
        agno_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agno Run Id
        configuration_snapshot:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Configuration Snapshot
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        events:
          items:
            $ref: '#/components/schemas/RunEventResponse'
          title: Events
          type: array
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          title: Id
          type: string
        input_text:
          title: Input Text
          type: string
        is_mock:
          title: Is Mock
          type: boolean
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        plan_id:
          title: Plan Id
          type: string
        runtime_type:
          title: Runtime Type
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          title: Status
          type: string
        task_id:
          title: Task Id
          type: string
        team_id:
          title: Team Id
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        usage:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Usage
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - task_id
      - plan_id
      - team_id
      - status
      - runtime_type
      - is_mock
      - input_text
      title: RunDetailResponse
      type: object
    RunEventResponse:
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        event_type:
          title: Event Type
          type: string
        id:
          title: Id
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
        run_id:
          title: Run Id
          type: string
        sequence:
          minimum: 1.0
          title: Sequence
