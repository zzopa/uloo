        run_id:
          title: Run Id
          type: string
        sequence:
          minimum: 1.0
          title: Sequence
          type: integer
        source_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Id
        source_type:
          title: Source Type
          type: string
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      required:
      - id
      - run_id
      - sequence
      - event_type
      - source_type
      title: RunEventResponse
      type: object
    RunListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RunResponse'
          title: Items
          type: array
        limit:
          minimum: 1.0
          title: Limit
          type: integer
        offset:
          minimum: 0.0
          title: Offset
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      - offset
      - limit
      title: RunListResponse
      type: object
