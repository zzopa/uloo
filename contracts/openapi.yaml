components:
  schemas:
    AgentCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          default: true
          title: Enabled
          type: boolean
        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          title: Key
          type: string
        knowledge_refs:
          items:
            type: string
          title: Knowledge Refs
          type: array
        model_ref:
          description: e.g. openai-compatible:gpt-5-mini
          maxLength: 256
          minLength: 1
          title: Model Ref
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          maxLength: 256
          minLength: 1
          title: Role
          type: string
        skill_refs:
          items:
            type: string
          title: Skill Refs
          type: array
        tool_refs:
          items:
            type: string
          title: Tool Refs
          type: array
      required:
      - key
      - name
      - role
      - model_ref
      title: AgentCreate
      type: object
    AgentResponse:
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          title: Enabled
          type: boolean
        id:
          title: Id
          type: string
        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          title: Key
          type: string
        knowledge_refs:
          items:
            type: string
          title: Knowledge Refs
          type: array
        model_ref:
          description: e.g. openai-compatible:gpt-5-mini
          maxLength: 256
          minLength: 1
          title: Model Ref
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          maxLength: 256
          minLength: 1
          title: Role
          type: string
        skill_refs:
          items:
            type: string
          title: Skill Refs
          type: array
        tool_refs:
          items:
            type: string
          title: Tool Refs
          type: array
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        version:
          title: Version
          type: integer
      required:
      - key
      - name
      - role
      - model_ref
      - id
      - enabled
      - version
      title: AgentResponse
      type: object
    AgentTestRunRequest:
      properties:
        prompt:
          default: Confirm that this Agent is ready and summarize its role.
          maxLength: 20000
          minLength: 1
          title: Prompt
          type: string
      title: AgentTestRunRequest
      type: object
    AgentTestRunResponse:
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        is_mock:
          default: false
          title: Is Mock
          type: boolean
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        runtime_type:
          default: agno
          title: Runtime Type
          type: string
        status:
          title: Status
          type: string
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        usage:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Usage
      required:
      - status
      title: AgentTestRunResponse
      type: object
    AgentUpdate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        expected_version:
          description: Optimistic lock version
          minimum: 1.0
          title: Expected Version
          type: integer
        instructions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Instructions
        knowledge_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Knowledge Refs
        model_ref:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Model Ref
        name:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          anyOf:
          - maxLength: 256
            minLength: 1
            type: string
          - type: 'null'
          title: Role
        skill_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Skill Refs
        tool_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tool Refs
      required:
      - expected_version
      title: AgentUpdate
      type: object
    AgentValidateResponse:
      properties:
        errors:
          items:
            type: string
          title: Errors
          type: array
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: AgentValidateResponse
      type: object
    CapabilitiesResponse:
      description: Capabilities currently available from this running Core version.
      properties:
        agno_enabled:
          title: Agno Enabled
          type: boolean
        features:
          $ref: '#/components/schemas/FeatureCapabilities'
        models:
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          title: Models
          type: object
        modes:
          items:
            type: string
          title: Modes
          type: array
        tools:
          items:
            type: string
          title: Tools
          type: array
        version:
          title: Version
          type: string
      required:
      - version
      - modes
      - features
      - models
      - tools
      - agno_enabled
      title: CapabilitiesResponse
      type: object
    ErrorResponse:
      description: Stable error envelope returned by every ULOO Core endpoint.
      properties:
        code:
          description: Stable machine-readable error code
          title: Code
          type: string
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
        message:
          description: Safe human-readable error message
          title: Message
          type: string
        request_id:
          title: Request Id
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - code
      - message
      - request_id
      - trace_id
      title: ErrorResponse
      type: object
    FeatureCapabilities:
      description: Feature flags describe implemented behavior, not planned behavior.
      properties:
        agent_test_runs:
          title: Agent Test Runs
          type: boolean
        agents:
          title: Agents
          type: boolean
        memory:
          title: Memory
          type: boolean
        streaming:
          title: Streaming
          type: boolean
        team_runs:
          title: Team Runs
          type: boolean
        teams:
          title: Teams
          type: boolean
      required:
      - agents
      - teams
      - agent_test_runs
      - team_runs
      - streaming
      - memory
      title: FeatureCapabilities
      type: object
    MemoryPolicy:
      properties:
        read_scopes:
          items:
            enum:
            - project
            - team
            - agent
            type: string
          title: Read Scopes
          type: array
        write_scope:
          default: team
          enum:
          - project
          - team
          - agent
          title: Write Scope
          type: string
      title: MemoryPolicy
      type: object
    Page_AgentResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentResponse'
          title: Items
          type: array
        limit:
          minimum: 1.0
          title: Limit
          type: integer
        offset:
          minimum: 0.0
          title: Offset
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      - offset
      - limit
      title: Page[AgentResponse]
      type: object
    Page_TeamResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TeamResponse'
          title: Items
          type: array
        limit:
          minimum: 1.0
          title: Limit
          type: integer
        offset:
          minimum: 0.0
          title: Offset
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      - offset
      - limit
      title: Page[TeamResponse]
      type: object
    ResourceCreate:
      additionalProperties: false
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        enabled:
          default: true
          title: Enabled
          type: boolean
        key:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9._-]*$
          title: Key
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
      required:
      - key
      - name
      title: ResourceCreate
      type: object
    ResourceResponse:
      additionalProperties: false
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        enabled:
          default: true
          title: Enabled
          type: boolean
        key:
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9._-]*$
          title: Key
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
        version:
          title: Version
          type: integer
      required:
      - key
      - name
      - version
      title: ResourceResponse
      type: object
    ResourceUpdate:
      additionalProperties: false
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        enabled:
          title: Enabled
          type: boolean
        expected_version:
          minimum: 0.0
          title: Expected Version
          type: integer
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
      required:
      - name
      - config
      - enabled
      - expected_version
      title: ResourceUpdate
      type: object
    RunCreate:
      properties:
        input:
          anyOf:
          - maxLength: 100000
            minLength: 1
            type: string
          - type: 'null'
          title: Input
      title: RunCreate
      type: object
    RunDetailResponse:
      properties:
        agno_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agno Run Id
        configuration_snapshot:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Configuration Snapshot
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        events:
          items:
            $ref: '#/components/schemas/RunEventResponse'
          title: Events
          type: array
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        id:
          title: Id
          type: string
        input_text:
          title: Input Text
          type: string
        is_mock:
          title: Is Mock
          type: boolean
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        plan_id:
          title: Plan Id
          type: string
        runtime_type:
          title: Runtime Type
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          title: Status
          type: string
        task_id:
          title: Task Id
          type: string
        team_id:
          title: Team Id
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        usage:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Usage
        workspace_id:
          title: Workspace Id
          type: string
      required:
      - id
      - workspace_id
      - task_id
      - plan_id
      - team_id
      - status
      - runtime_type
      - is_mock
      - input_text
