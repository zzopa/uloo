      type: object
    TaskCreate:
      properties:
        query:
          description: User's original request
          maxLength: 100000
          minLength: 1
          title: Query
          type: string
        team_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional explicit team selection
          title: Team Id
        title:
          description: Short task title
          maxLength: 512
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - query
      title: TaskCreate
      type: object
    TaskDetailResponse:
      description: Task plus its current plan and latest run summary.
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        current_plan_version:
          title: Current Plan Version
          type: integer
        id:
          title: Id
          type: string
        plans:
          items:
            $ref: '#/components/schemas/TaskPlanResponse'
          title: Plans
          type: array
        query:
          title: Query
          type: string
        session_id:
          title: Session Id
          type: string
        status:
          title: Status
          type: string
        team_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
        title:
          title: Title
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
