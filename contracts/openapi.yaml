components:
  schemas:
    AgentCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          default: true
          title: Enabled
          type: boolean
        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          title: Key
          type: string
        knowledge_refs:
          items:
            type: string
          title: Knowledge Refs
          type: array
        model_ref:
          description: e.g. openai-compatible:gpt-5-mini
          title: Model Ref
          type: string
        name:
          maxLength: 256
          title: Name
          type: string
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          maxLength: 256
          title: Role
          type: string
        tool_refs:
          items:
            type: string
          title: Tool Refs
          type: array
      required:
      - key
      - name
      - role
      - model_ref
      title: AgentCreate
      type: object
    AgentResponse:
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          title: Enabled
          type: boolean
        id:
          title: Id
          type: string
        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          title: Key
          type: string
        knowledge_refs:
          items:
            type: string
          title: Knowledge Refs
          type: array
        model_ref:
          description: e.g. openai-compatible:gpt-5-mini
          title: Model Ref
          type: string
        name:
          maxLength: 256
          title: Name
          type: string
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          maxLength: 256
          title: Role
          type: string
        tool_refs:
          items:
            type: string
          title: Tool Refs
          type: array
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        version:
          title: Version
          type: integer
      required:
      - key
      - name
      - role
      - model_ref
      - id
      - enabled
      - version
      title: AgentResponse
      type: object
    AgentTestRunResponse:
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        is_mock:
          default: false
          title: Is Mock
          type: boolean
        output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        runtime_type:
          default: agno
          title: Runtime Type
          type: string
        status:
          title: Status
          type: string
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        usage:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Usage
      required:
      - status
      title: AgentTestRunResponse
      type: object
    AgentUpdate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
        expected_version:
          description: Optimistic lock version
          title: Expected Version
          type: integer
        instructions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Instructions
        knowledge_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Knowledge Refs
        model_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Ref
        name:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Name
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
        role:
          anyOf:
          - maxLength: 256
            type: string
          - type: 'null'
          title: Role
        tool_refs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tool Refs
      required:
      - expected_version
      title: AgentUpdate
      type: object
    AgentValidateResponse:
      properties:
        errors:
          items:
            type: string
          title: Errors
          type: array
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      title: AgentValidateResponse
      type: object
    CapabilitiesResponse:
      description: Capabilities currently available from this running Core version.
      properties:
        agno_enabled:
          title: Agno Enabled
          type: boolean
        features:
          $ref: '#/components/schemas/FeatureCapabilities'
        models:
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          title: Models
          type: object
        modes:
          items:
            type: string
          title: Modes
          type: array
        tools:
          items:
            type: string
          title: Tools
          type: array
        version:
          title: Version
          type: string
      required:
      - version
      - modes
      - features
      - models
      - tools
      - agno_enabled
      title: CapabilitiesResponse
      type: object
    ErrorResponse:
      description: Stable error envelope returned by every ULOO Core endpoint.
      properties:
        code:
          description: Stable machine-readable error code
          title: Code
          type: string
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
        message:
          description: Safe human-readable error message
          title: Message
          type: string
        request_id:
          title: Request Id
          type: string
        trace_id:
          title: Trace Id
          type: string
      required:
      - code
      - message
      - request_id
      - trace_id
      title: ErrorResponse
      type: object
    FeatureCapabilities:
      description: Feature flags describe implemented behavior, not planned behavior.
      properties:
        agent_test_runs:
          title: Agent Test Runs
          type: boolean
        agents:
          title: Agents
          type: boolean
        memory:
          title: Memory
          type: boolean
        streaming:
          title: Streaming
          type: boolean
        team_runs:
          title: Team Runs
          type: boolean
        teams:
          title: Teams
          type: boolean
      required:
      - agents
      - teams
      - agent_test_runs
      - team_runs
      - streaming
      - memory
      title: FeatureCapabilities
      type: object
    MemoryPolicy:
      properties:
        read_scopes:
          items:
            type: string
          title: Read Scopes
          type: array
        write_scope:
          default: team
