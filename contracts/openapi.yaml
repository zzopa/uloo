      - id
      - title
      - query
      - status
      - session_id
      - current_plan_version
      title: TaskDetailResponse
      type: object
    TaskListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TaskResponse'
          title: Items
          type: array
        limit:
          minimum: 1.0
          title: Limit
          type: integer
        offset:
          minimum: 0.0
          title: Offset
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - total
      - offset
      - limit
      title: TaskListResponse
      type: object
    TaskPlanRequest:
      properties:
        feedback:
          anyOf:
          - maxLength: 4000
            type: string
          - type: 'null'
          title: Feedback
      title: TaskPlanRequest
      type: object
    TaskPlanResponse:
      properties:
        approval_status:
          default: pending
          pattern: pending|approved|rejected
          title: Approval Status
          type: string
        assumptions:
          items:
            type: string
          title: Assumptions
          type: array
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        id:
          title: Id
          type: string
        is_mock:
          default: false
          title: Is Mock
          type: boolean
        planner_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Planner Run Id
        questions:
          items:
            type: string
          title: Questions
          type: array
        recommended_team_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommended Team Id
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
        runtime_type:
          default: agno
          title: Runtime Type
          type: string
        steps:
          items:
            $ref: '#/components/schemas/TaskPlanStep'
          title: Steps
          type: array
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
        task_id:
          title: Task Id
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        usage:
          anyOf:
          - additionalProperties:
              type: integer
            type: object
          - type: 'null'
          title: Usage
        version:
          title: Version
          type: integer
      required:
      - id
      - task_id
      - version
      title: TaskPlanResponse
      type: object
    TaskPlanStep:
      description: One step of an execution plan.
      properties:
        assigned_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Assigned Agent Id
        depends_on:
          items:
            type: string
          title: Depends On
          type: array
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        expected_output:
          anyOf:
          - type: string
          - type: 'null'
          title: Expected Output
        id:
          description: Stable step id within the plan
          title: Id
          type: string
        status:
          default: pending
          enum:
          - pending
          - running
          - completed
          - failed
          - skipped
          title: Status
          type: string
        title:
          maxLength: 256
          minLength: 1
          title: Title
          type: string
      required:
      - id
      - title
      title: TaskPlanStep
      type: object
    TaskResponse:
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        current_plan_version:
          title: Current Plan Version
          type: integer
        id:
          title: Id
          type: string
        query:
          title: Query
          type: string
        session_id:
          title: Session Id
          type: string
        status:
          title: Status
          type: string
        team_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
        title:
          title: Title
          type: string
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
      required:
      - id
      - title
      - query
      - status
      - session_id
      - current_plan_version
      title: TaskResponse
      type: object
    TeamCreate:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        enabled:
          default: true
          title: Enabled
          type: boolean
        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          title: Key
          type: string
        leader_agent_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Required for coordinate, route
          title: Leader Agent Id
        limits:
          $ref: '#/components/schemas/TeamLimits'
        member_agent_ids:
          items:
            format: uuid
            type: string
          title: Member Agent Ids
          type: array
        memory_policy:
          $ref: '#/components/schemas/MemoryPolicy'
        mode:
          description: 'One of: coordinate, route, collaborate'
          title: Mode
          type: string
        name:
          maxLength: 256
          minLength: 1
          title: Name
          type: string
      required:
      - key
      - name
      - mode
      title: TeamCreate
      type: object
    TeamLimits:
      properties:
        max_iterations:
          default: 8
          maximum: 100.0
          minimum: 1.0
          title: Max Iterations
          type: integer
        max_tokens:
          default: 20000
          maximum: 2000000.0
          minimum: 1.0
          title: Max Tokens
          type: integer
        timeout_seconds:
          default: 120
