  title: ULOO Core
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/agents:
    get:
      description: List and search agents.
      operationId: list_agents_api_v1_agents_get
      parameters:
      - description: Search in name/key/role
        in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search in name/key/role
          title: Q
      - in: query
        name: enabled
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      - in: query
        name: model_ref
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Ref
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Token
      - in: query
        name: workspace
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace
