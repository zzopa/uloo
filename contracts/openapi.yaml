        instructions:
          items:
            type: string
          title: Instructions
          type: array
        key:
          description: Unique stable key
          maxLength: 128
          title: Key
          type: string
        leader_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          description: Required for coordinate, route
          title: Leader Agent Id
        limits:
